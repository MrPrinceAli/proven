name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    services:
      # Dipakai test integrasi DB mulai W2 (§S12.2).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proven
          POSTGRES_PASSWORD: proven
          POSTGRES_DB: proven_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proven -d proven_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://proven:proven@localhost:5432/proven_test
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts:
    name: Contracts (Foundry + Anvil)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge build --sizes
      - run: forge test -vvv
      - name: Coverage
        run: forge coverage --report summary --no-match-coverage "(script|test)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Committed ABI matches compiled contracts
        run: node scripts/export-abi.mjs && git diff --exit-code -- abi/
      - name: Start Anvil
        run: |
          anvil --chain-id 31337 > anvil.log 2>&1 &
          for i in $(seq 1 30); do cast chain-id --rpc-url http://127.0.0.1:8545 && exit 0; sleep 1; done
          cat anvil.log; exit 1
      - run: bash scripts/deploy-local.sh
      - run: bash scripts/smoke-local.sh
